name: Backend Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
      - name: Deploy Admin via SSM (wait + logs)
        shell: bash
        run: |
          set -e
          INSTANCE_ID="i-052b7e256950eff26"

          echo "Sending deploy command via SSM..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy UAT backend (main)" \
            --parameters commands="/usr/local/bin/BackendDeployment.sh" \
            --query "Command.CommandId" \
            --output text)
          echo "SSM Command ID: $COMMAND_ID"

          sleep 5
          echo "Waiting for command to complete..."

          show_logs () {
            echo "----- STDOUT -----"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "StandardOutputContent" \
              --output text || true
            echo "----- STDERR -----"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" \
              --output text || true
          }

          MAX_TRIES=120   # 120 x 5s = 10 minutes
          TRIES=0
          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text)
            echo "Current status: $STATUS"

            if [[ "$STATUS" == "Success" ]]; then
              echo "=== DEPLOY OUTPUT ==="
              show_logs
              echo "=== DEPLOY SUCCESS ==="
              break
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              echo "=== DEPLOY FAILED ($STATUS) ==="
              show_logs
              exit 1
            fi

            TRIES=$((TRIES+1))
            if [[ $TRIES -ge $MAX_TRIES ]]; then
              echo "=== TIMEOUT waiting for SSM command ==="
              show_logs
              exit 1
            fi
            sleep 5
          done
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      
